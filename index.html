<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artex AI</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app">
        <div class="backdrop" id="backdrop"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="new-chat">+ New Chat</button>
            </div>
            <div class="history-list"></div>
            <div class="sidebar-footer">
                <p>Created by <strong>Aditya Yadav</strong></p>
            </div>
        </aside>

        <main class="main">
            <header class="header">
                <button class="menu-btn" id="menu-btn">☰</button>
                <h1>Artex AI</h1>
            </header>

            <div class="chat-container" id="chat-box">
                <div class="welcome-box" id="welcome-screen">
                    <h2>Artex AI me aapka swagat hai 🚀</h2>
                    <p>Aaj main aapki kya madad kar sakta hoon?</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="user-input" placeholder="Artex AI se kuch bhi poochein..." rows="1"></textarea>
                    <button id="send-btn" title="Send">➔</button>
                    <button id="stop-btn" style="display: none;" title="Stop">⏹</button>
                </div>
            </div>
        </main>
    </div>

    <script src="/script.js"></script>
</body>
</html>
