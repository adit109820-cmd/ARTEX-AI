<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artex AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <h2>Artex AI</h2>
        </div>

        <button class="new-chat">+ New Chat</button>

        <div class="history">
            <p>Today's Chats</p>
        </div>

    </aside>

    <!-- Main Chat Area -->
    <main class="chat-container">

        <!-- Header -->
        <header class="top-bar">
            <h1>Artex AI</h1>
        </header>

        <!-- Messages -->
        <section class="chat-box">

            <div class="bot-message">
                Hello Boss! 👋
            </div>

        </section>

        <!-- Input -->
        <div class="input-area">

            <input
                type="text"
                placeholder="Message Artex AI...">

            <button>Send</button>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
