<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Artex AI - Ultra Premium</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      --primary-glow: rgba(124, 58, 237, 0.4);
      --glass-bg: rgba(15, 23, 42, 0.65);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-card: rgba(255, 255, 255, 0.04);
      --glass-card-hover: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #030712;
    }

    body { 
      display: flex; 
      color: var(--text-main); 
      position: relative;
    }

    /* ULTRA AMBIENT BACKGROUND GLOWS */
    .glow-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
      animation: floatPulse 12s infinite alternate ease-in-out;
    }
    .glow-blob-1 {
      top: -120px; left: -100px; width: 420px; height: 420px;
      background: rgba(37, 99, 235, 0.3);
    }
    .glow-blob-2 {
      bottom: -140px; right: -100px; width: 480px; height: 480px;
      background: rgba(124, 58, 237, 0.25);
      animation-delay: -6s;
    }
    .glow-blob-3 {
      top: 40%; left: 50%; transform: translate(-50%, -50%);
      width: 350px; height: 350px;
      background: rgba(236, 72, 153, 0.12);
    }

    @keyframes floatPulse {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.1) translate(20px, -20px); }
    }

    /* GLASSMORPHIC SIDEBAR */
    .sidebar {
      width: 320px;
      max-width: 85vw;
      background: rgba(11, 17, 32, 0.75);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-right: 1px solid var(--glass-border);
      padding: 26px 22px; display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; height: 100%; z-index: 100;
      transform: translateX(-100%); 
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 20px 0 50px rgba(0, 0, 0, 0.7);
    }
    .sidebar.open { transform: translateX(0); }

    .logo-container { margin-bottom: 28px; }
    .logo { 
      font-size: 28px; font-weight: 700; 
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.3));
    }
    .header-logo {
      font-size: 22px; font-weight: 700; 
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .status { font-size: 13px; color: #34d399; display: flex; align-items: center; gap: 8px; font-weight: 500; margin-top: 4px; }
    .status-dot { width: 8px; height: 8px; background-color: #34d399; border-radius: 50%; box-shadow: 0 0 12px #34d399; }

    .new-chat-btn {
      background: var(--primary-gradient);
      color: white; border: 1px solid rgba(255, 255, 255, 0.2); 
      padding: 15px; border-radius: 20px; font-weight: 600; font-size: 15px; cursor: pointer;
      margin-bottom: 24px; box-shadow: 0 10px 30px var(--primary-glow);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1); display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .new-chat-btn:hover { box-shadow: 0 14px 38px rgba(124, 58, 237, 0.6); transform: translateY(-2px); }

    .section-title { font-size: 11px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px; }

    .chats-list { flex: 1; overflow-y: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 10px; }
    .chats-list::-webkit-scrollbar { width: 4px; }
    .chats-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }

    .chat-item {
      background: var(--glass-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border); padding: 14px 18px; border-radius: 18px; 
      display: flex; justify-content: space-between; align-items: center; 
      cursor: pointer; color: #cbd5e1; font-size: 14px; font-weight: 500;
      transition: all 0.25s ease;
    }
    .chat-item:hover { background: var(--glass-card-hover); border-color: rgba(255, 255, 255, 0.25); color: #ffffff; }
    .chat-item.active { 
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.25), rgba(124, 58, 237, 0.25)); 
      border: 1px solid rgba(168, 85, 247, 0.5); color: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    .chat-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }

    .dots-btn { background: none; border: none; color: var(--text-sub); font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: color 0.2s; }
    .dots-btn:hover { color: #ffffff; }

    .settings-btn { display: none !important; }

    /* CONTEXT MENU */
    .global-context-menu {
      display: none; position: fixed; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border); border-radius: 18px; z-index: 9999; width: 165px; overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }
    .global-context-menu.show { display: block; animation: menuIn 0.18s ease-out; }
    @keyframes menuIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    .dropdown-item { padding: 12px 18px; font-size: 13px; color: #e2e8f0; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.2s; }
    .dropdown-item:hover { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .dropdown-item.delete { color: #f87171; }
    .dropdown-item.delete:hover { background: rgba(248, 113, 113, 0.15); color: #ef4444; }

    /* MAIN CHAT AREA */
    .main-chat { 
      flex: 1; display: flex; flex-direction: column; 
      width: 100%; height: 100%; position: relative; z-index: 1; 
    }
    
    .chat-header {
      padding: 16px 24px; font-size: 19px; font-weight: 600;
      border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; gap: 16px;
      background: rgba(3, 7, 18, 0.55); backdrop-filter: blur(20px);
    }

    .menu-btn {
      background: var(--glass-card); border: 1px solid var(--glass-border); 
      color: #ffffff; font-size: 20px; cursor: pointer; width: 42px; height: 42px;
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      transition: all 0.25s ease;
    }
    .menu-btn:hover { background: var(--glass-card-hover); border-color: rgba(255,255,255,0.25); }

    .export-header-btn {
      margin-left: auto;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      color: #38bdf8;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
    }
    .export-header-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }

    .messages-container { 
      flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; 
    }
    .messages-container::-webkit-scrollbar { width: 5px; }
    .messages-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 10px; }

    /* FADE SLIDE UP ANIMATION */
    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(28px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* CHAT BUBBLES */
    .msg { 
      max-width: 85%; padding: 18px 24px; font-size: 14.5px; line-height: 1.7; 
      border-radius: 22px; word-break: break-word;
      animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .user-msg { 
      align-self: flex-end; background: var(--primary-gradient); 
      color: #ffffff; border-bottom-right-radius: 6px; box-shadow: 0 10px 28px var(--primary-glow);
      white-space: pre-wrap;
    }
    
    .ai-msg { 
      align-self: flex-start; background: rgba(255, 255, 255, 0.035); 
      backdrop-filter: blur(20px); border: 1px solid var(--glass-border); 
      color: #f1f5f9; border-bottom-left-radius: 6px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* MARKDOWN STYLING FOR HEADINGS & PARAGRAPHS */
    .ai-msg p { margin-bottom: 12px; }
    .ai-msg p:last-child { margin-bottom: 0; }
    
    .ai-msg h1 { 
      font-size: 21px; font-weight: 700; color: #38bdf8; 
      margin: 18px 0 10px 0; border-bottom: 1px solid rgba(56, 189, 248, 0.25); 
      padding-bottom: 6px; letter-spacing: -0.3px;
    }
    .ai-msg h2 { 
      font-size: 18px; font-weight: 600; color: #a78bfa; 
      margin: 16px 0 8px 0; border-bottom: 1px dashed rgba(167, 139, 250, 0.2);
      padding-bottom: 4px;
    }
    .ai-msg h3 { 
      font-size: 15.5px; font-weight: 600; color: #f472b6; 
      margin: 14px 0 6px 0; 
    }

    .ai-msg ul, .ai-msg ol { margin: 10px 0 12px 22px; }
    .ai-msg li { margin-bottom: 6px; }
    .ai-msg strong { color: #38bdf8; font-weight: 600; }
    .ai-msg blockquote { 
      border-left: 3px solid #818cf8; padding-left: 14px; 
      margin: 12px 0; color: #94a3b8; font-style: italic; 
    }

    /* STARTER PROMPT CARDS (WELCOME SCREEN) */
    .starter-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto;
      max-width: 650px;
      width: 100%;
      text-align: center;
      padding: 20px;
      animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .starter-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .starter-subtitle {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 28px;
      font-weight: 400;
    }
    .starter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      width: 100%;
    }
    .prompt-card {
      background: var(--glass-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 18px;
      text-align: left;
      cursor: pointer;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .prompt-card:hover {
      background: var(--glass-card-hover);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    .prompt-card-icon {
      font-size: 22px;
      margin-bottom: 10px;
    }
    .prompt-card-title {
      font-size: 14.5px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .prompt-card-desc {
      font-size: 12.5px;
      color: var(--text-sub);
      line-height: 1.45;
    }
    
    /* CODE BLOCK STYLING WITH COPY BUTTON */
    .ai-msg pre {
      background: #1e1e2e !important;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 14px;
      margin: 14px 0;
      overflow-x: auto;
      position: relative;
    }
    .ai-msg code {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13.5px;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      padding: 8px 14px;
      border-radius: 10px 10px 0 0;
      margin: -14px -14px 12px -14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
    }
    .copy-code-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .copy-code-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      color: #ffffff;
    }

    /* INPUT CONTAINER */
    .input-container { 
      padding: 18px 24px; display: flex; gap: 14px; 
      border-top: 1px solid var(--glass-border); 
      background: rgba(3, 7, 18, 0.65); backdrop-filter: blur(20px);
    }
    
    .input-box {
      flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border);
      padding: 15px 24px; border-radius: 30px; color: white; outline: none; font-size: 14.5px;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .input-box::placeholder { color: #64748b; }
    .input-box:focus { border-color: #818cf8; background: rgba(255, 255, 255, 0.08); box-shadow: 0 0 25px rgba(129, 140, 248, 0.3); }

    .send-btn {
      background: var(--primary-gradient); color: white; border: none;
      padding: 0 30px; border-radius: 30px; font-weight: 600; font-size: 15px; cursor: pointer;
      box-shadow: 0 8px 25px var(--primary-glow); transition: all 0.28s ease;
    }
    .send-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(124, 58, 237, 0.65); }

    /* MODAL OVERLAYS */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(10px); z-index: 10000; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .glass-modal { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); padding: 28px; border-radius: 26px; width: 90%; max-width: 420px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8); }
    .modal-title { font-size: 19px; font-weight: 600; margin-bottom: 8px; color: #38bdf8; }
    .modal-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 18px; line-height: 1.5; }
    .modal-input { width: 100%; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--glass-border); padding: 13px 18px; border-radius: 16px; color: white; font-size: 14px; outline: none; margin-bottom: 22px; transition: border-color 0.2s; }
    .modal-input:focus { border-color: #38bdf8; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
    .modal-btn { padding: 11px 22px; border-radius: 14px; border: none; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .modal-btn.cancel { background: rgba(255, 255, 255, 0.08); color: #cbd5e1; }
    .modal-btn.cancel:hover { background: rgba(255, 255, 255, 0.15); }
    .modal-btn.save { background: var(--primary-gradient); color: white; box-shadow: 0 6px 20px var(--primary-glow); }

    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.55); z-index: 90; backdrop-filter: blur(4px); }
    .overlay.active { display: block; }
  </style>
</head>
<body>

  <div class="glow-blob glow-blob-1"></div>
  <div class="glow-blob glow-blob-2"></div>
  <div class="glow-blob glow-blob-3"></div>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <div class="sidebar" id="sidebar">
    <div class="logo-container">
      <div class="logo">Artex AI</div>
      <div class="status"><span class="status-dot"></span> Online</div>
    </div>
    
    <button class="new-chat-btn" onclick="createNewChat()">
      <span>+</span> New Chat
    </button>

    <div class="section-title">Today's Chats</div>
    <div class="chats-list" id="chats-list"></div>

    <button class="settings-btn" onclick="openApiModal()">⚙️ OpenRouter API Key</button>
  </div>

  <div class="main-chat">
    <div class="chat-header">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <span class="header-logo">Artex AI</span>
      <button class="export-header-btn" onclick="exportChat()" title="Export Current Chat">📥 Export</button>
    </div>
    
    <div class="messages-container" id="messages-container"></div>

    <div class="input-container">
      <input type="text" class="input-box" id="user-input" placeholder="Ask Artex AI something..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div class="global-context-menu" id="global-context-menu">
    <div class="dropdown-item" onclick="handleRename()">✏️ Rename</div>
    <div class="dropdown-item" onclick="handleDuplicate()">📋 Duplicate</div>
    <div class="dropdown-item" onclick="handleExportContext()">📥 Export</div>
    <div class="dropdown-item delete" onclick="handleDelete()">🗑️ Delete</div>
  </div>

  <div class="modal-overlay" id="rename-modal">
    <div class="glass-modal">
      <div class="modal-title">Rename Chat</div>
      <p class="modal-desc">Apni chat ka naya naam rakhein:</p>
      <input type="text" class="modal-input" id="rename-input" placeholder="Enter title...">
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeRenameModal()">Cancel</button>
        <button class="modal-btn save" onclick="saveRename()">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="api-modal">
    <div class="glass-modal">
      <div class="modal-title">Set OpenRouter API Key</div>
      <p class="modal-desc">openrouter.ai se free key le kar paste karein:</p>
      <input type="password" class="modal-input" id="api-key-input" placeholder="Paste sk-or-v1... Key Here">
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeApiModal()">Cancel</button>
        <button class="modal-btn save" onclick="saveApiKey()">Save Key</button>
      </div>
    </div>
  </div>

  <script>
    // ✅ Nayi Line:
    let apiKey = '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';
    let chats = JSON.parse(localStorage.getItem('ARTEX_CHATS')) || [
      {
        id: 'chat-1',
        title: 'New Chat 1',
        messages: []
      }
    ];

    let activeChatId = chats[0]?.id || 'chat-1';
    let targetChatId = null;

    function saveState() {
      localStorage.setItem('ARTEX_CHATS', JSON.stringify(chats));
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('active');
    }

    function renderChats() {
      const container = document.getElementById('chats-list');
      container.innerHTML = '';
      chats.forEach(chat => {
        const item = document.createElement('div');
        item.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
        item.onclick = () => selectChat(chat.id);
        item.innerHTML = `
          <span class="chat-title">${escapeHtml(chat.title)}</span>
          <button class="dots-btn" onclick="openContextMenu(event, '${chat.id}')">⋮</button>
        `;
        container.appendChild(item);
      });
    }

    function renderMessages() {
      const container = document.getElementById('messages-container');
      container.innerHTML = '';
      const currentChat = chats.find(c => c.id === activeChatId);
      if (!currentChat) return;

      if (!currentChat.messages || currentChat.messages.length === 0) {
        const starterDiv = document.createElement('div');
        starterDiv.className = 'starter-container';
        starterDiv.innerHTML = `
          <div class="starter-title">Welcome to Artex AI</div>
          <div class="starter-subtitle">What would you like to explore today?</div>
          <div class="starter-grid">
            <div class="prompt-card" onclick="sendStarterPrompt('Give me 5 unique web development project ideas with technical details')">
              <div class="prompt-card-icon">💡</div>
              <div class="prompt-card-title">Brainstorm Ideas</div>
              <div class="prompt-card-desc">Unique web development project ideas for developers</div>
            </div>
            <div class="prompt-card" onclick="sendStarterPrompt('Write a Python script to scrape website details using BeautifulSoup')">
              <div class="prompt-card-icon">💻</div>
              <div class="prompt-card-title">Write Code</div>
              <div class="prompt-card-desc">Python web scraping script with clear comments</div>
            </div>
            <div class="prompt-card" onclick="sendStarterPrompt('Draft a professional email requesting project feedback from a client')">
              <div class="prompt-card-icon">📝</div>
              <div class="prompt-card-title">Draft Email</div>
              <div class="prompt-card-desc">Polite feedback request email template</div>
            </div>
            <div class="prompt-card" onclick="sendStarterPrompt('Explain Quantum Computing in simple terms for a beginner')">
              <div class="prompt-card-icon">🚀</div>
              <div class="prompt-card-title">Explain Concept</div>
              <div class="prompt-card-desc">Quantum Computing explained in easy terms</div>
            </div>
          </div>
        `;
        container.appendChild(starterDiv);
        return;
      }

      currentChat.messages.forEach(msg => {
        const bubble = document.createElement('div');
        bubble.className = `msg ${msg.sender === 'user' ? 'user-msg' : 'ai-msg'}`;
        
        if (msg.sender === 'user') {
          bubble.innerText = msg.text;
        } else {
          bubble.innerHTML = marked.parse(msg.text);

          bubble.querySelectorAll('pre').forEach(pre => {
            const codeBlock = pre.querySelector('code');
            if (codeBlock) {
              const langClass = Array.from(codeBlock.classList).find(c => c.startsWith('language-'));
              const language = langClass ? langClass.replace('language-', '') : 'Code';
              
              if (!pre.querySelector('.code-header')) {
                const header = document.createElement('div');
                header.className = 'code-header';
                header.innerHTML = `
                  <span>${language}</span>
                  <button class="copy-code-btn" onclick="copyCode(this)">Copy</button>
                `;
                pre.insertBefore(header, pre.firstChild);
              }
              hljs.highlightElement(codeBlock);
            }
          });
        }
        container.appendChild(bubble);
      });
      container.scrollTop = container.scrollHeight;
    }

    function sendStarterPrompt(promptText) {
      document.getElementById('user-input').value = promptText;
      sendMessage();
    }

    function copyCode(btn) {
      const pre = btn.closest('pre');
      const code = pre.querySelector('code').innerText;
      navigator.clipboard.writeText(code).then(() => {
        btn.innerText = 'Copied!';
        setTimeout(() => { btn.innerText = 'Copy'; }, 2000);
      });
    }

    function exportChat(chatId = activeChatId) {
      const chat = chats.find(c => c.id === chatId);
      if (!chat || !chat.messages || chat.messages.length === 0) {
        alert("Is chat me export karne ke liye koi messages nahi hain!");
        return;
      }

      let exportText = `=======================================\n`;
      exportText += ` Artex AI - Conversation Export\n`;
      exportText += ` Title: ${chat.title}\n`;
      exportText += ` Date: ${new Date().toLocaleString()}\n`;
      exportText += `=======================================\n\n`;

      chat.messages.forEach((msg) => {
        const sender = msg.sender === 'user' ? 'YOU' : 'ARTEX AI';
        exportText += `[${sender}]:\n${msg.text}\n\n---------------------------------------\n\n`;
      });

      const blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${chat.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_export.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function handleExportContext() {
      if (targetChatId) exportChat(targetChatId);
    }

    function selectChat(id) {
      activeChatId = id;
      renderChats();
      renderMessages();
    }

    function createNewChat() {
      const newId = 'chat-' + Date.now();
      chats.unshift({
        id: newId,
        title: `New Chat ${chats.length + 1}`,
        messages: []
      });
      activeChatId = newId;
      saveState();
      renderChats();
      renderMessages();
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      if (!apiKey) {
        alert("Pehle side menu se OpenRouter API Key add karein!");
        openApiModal();
        return;
      }

      const currentChat = chats.find(c => c.id === activeChatId);
      if (!currentChat) return;

      currentChat.messages.push({ sender: 'user', text: text });
      input.value = '';
      saveState();
      renderMessages();

      const loadingMsg = { sender: 'ai', text: 'Artex is thinking...' };
      currentChat.messages.push(loadingMsg);
      renderMessages();

      const cleanKey = apiKey.trim();

      const freeModels = [
        "google/gemini-2.0-flash-exp:free",
        "deepseek/deepseek-r1:free",
        "meta-llama/llama-3.3-70b-instruct:free",
        "mistralai/mistral-7b-instruct:free",
        "openrouter/auto"
      ];

      let aiResponseText = null;
      let lastErr = '';

      const systemInstruction = "You are Artex AI. Always structure your responses neatly using Markdown headings (#, ##, ###), bullet points, and well-organized sections. If anyone asks about your developer, owner, creator, or designer, always clearly answer that you were developed and created by Aditya Yadav from India. If anyone asks about Seema Tomar, always state that she is a brilliant and a very intelligent teacher of my developer/owner.";

      for (const modelName of freeModels) {
        try {
          const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${cleanKey}`,
              "Content-Type": "application/json",
              "HTTP-Referer": window.location.href,
              "X-Title": "Artex AI"
            },
            body: JSON.stringify({
              model: modelName,
              max_tokens: 1500,
              messages: [
                { role: "system", content: systemInstruction },
                { role: "user", content: text }
              ]
            })
          });

          const data = await response.json();

          if (response.ok && data.choices && data.choices[0]?.message?.content) {
            aiResponseText = data.choices[0].message.content;
            break;
          } else if (data.error) {
            lastErr = `[${modelName}] ${data.error.message || JSON.stringify(data.error)}`;
          }
        } catch (err) {
          lastErr = err.message;
        }
      }

      currentChat.messages.pop();

      if (aiResponseText) {
        currentChat.messages.push({ sender: 'ai', text: aiResponseText });
      } else {
        currentChat.messages.push({ 
          sender: 'ai', 
          text: `⚠️ OpenRouter Error: All models failed. Last detail: ${lastErr}` 
        });
      }

      saveState();
      renderMessages();
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

    function openContextMenu(event, id) {
      event.stopPropagation();
      targetChatId = id;
      const menu = document.getElementById('global-context-menu');
      const btn = event.currentTarget;
      const rect = btn.getBoundingClientRect();
      menu.style.top = `${rect.bottom + 4}px`;
      menu.style.left = `${Math.min(rect.left - 100, window.innerWidth - 175)}px`;
      menu.classList.add('show');
    }

    window.addEventListener('click', () => {
      document.getElementById('global-context-menu').classList.remove('show');
    });

    function handleRename() {
      const chat = chats.find(c => c.id === targetChatId);
      if (!chat) return;
      document.getElementById('rename-input').value = chat.title;
      document.getElementById('rename-modal').classList.add('active');
    }
    function closeRenameModal() { document.getElementById('rename-modal').classList.remove('active'); }
    function saveRename() {
      const newTitle = document.getElementById('rename-input').value.trim();
      if (newTitle) {
        const chat = chats.find(c => c.id === targetChatId);
        if (chat) { chat.title = newTitle; saveState(); renderChats(); }
      }
      closeRenameModal();
    }

    function handleDuplicate() {
      const chat = chats.find(c => c.id === targetChatId);
      if (!chat) return;
      const newId = 'chat-' + Date.now();
      chats.push({
        id: newId,
        title: `${chat.title} (Copy)`,
        messages: JSON.parse(JSON.stringify(chat.messages))
      });
      activeChatId = newId;
      saveState(); renderChats(); renderMessages();
    }

    function handleDelete() {
      if (chats.length <= 1) { alert("Aakhri chat delete nahi kar sakte!"); return; }
      chats = chats.filter(c => c.id !== targetChatId);
      if (activeChatId === targetChatId) activeChatId = chats[0].id;
      saveState(); renderChats(); renderMessages();
    }

    function openApiModal() {
      document.getElementById('api-key-input').value = apiKey;
      document.getElementById('api-modal').classList.add('active');
    }
    function closeApiModal() { document.getElementById('api-modal').classList.remove('active'); }
    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      apiKey = key;
      localStorage.setItem('ARTEX_OPENROUTER_KEY', key);
      closeApiModal();
      alert("OpenRouter API Key Saved!");
    }

    function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    renderChats();
    renderMessages();
  </script>

</body>
</html>
