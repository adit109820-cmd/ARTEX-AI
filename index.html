<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artex AI</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.min.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <button class="new-chat">+ New Chat</button>
            <div class="chat-history-list"></div>
        </aside>
        <div class="sidebar-backdrop"></div>

        <main class="main-content">
            <header class="top-header">
                <button class="menu-btn">☰</button>
                <h1 class="app-title">Artex AI</h1>
            </header>

            <div class="chat-box">
                <div class="welcome-screen">
                    <h2>Welcome to Artex AI 🚀</h2>
                    <p>How can I help you today?</p>
                </div>
            </div>

            <div class="input-container">
                <div class="input-box">
                    <textarea placeholder="Message Artex AI..." rows="1"></textarea>
                    <button id="send-btn" title="Send">➔</button>
                    <button class="stop-btn" style="display: none;" title="Stop">⏹</button>
                </div>
            </div>
        </main>
    </div>

    <script src="/script.js"></script>
</body>
</html>
